<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7B1E2E">
<title>MDAFC</title>
<link rel="icon" href="logo-bordeaux.png">
<link rel="apple-touch-icon" href="apple-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MDAFC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#7B1E2E; --red-dark:#5E1422; --red-soft:#F3E1DF;
  --navy-soft:#F1E4D6;
  --cream:#F6EADF; --gold:#C9A46A; --gold-soft:#F5EBDA;
  --bg:#FAF4EC; --card:#FFFDF9; --text:#2E1418; --muted:#8A6F68; --line:#EADBCB;
  --green:#2F6B3A; --green-soft:#E3F1E4;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
/* pas de zoom au double-tap ni au pincement : l'app se comporte comme une application native */
*{touch-action:manipulation}
input,select,textarea{font-size:16px}
body{font-family:Inter,system-ui,sans-serif;background:#E9DCCD;color:var(--text);display:flex;justify-content:center}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.app{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);overflow:hidden;overflow:clip;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(90,18,32,.15)}
[hidden]{display:none!important}

/* Splash */
.splash{position:absolute;inset:0;z-index:70;background:#F9EBE1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;transition:opacity .5s,transform .5s}
.splash.hide{opacity:0;transform:scale(1.04);pointer-events:none}
.splash img{width:min(80vw,312px);-webkit-mask-image:radial-gradient(ellipse closest-side,#000 88%,transparent 100%);mask-image:radial-gradient(ellipse closest-side,#000 88%,transparent 100%);animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
.splash h1{font-family:"Libre Baskerville",serif;color:var(--red);font-size:34px;letter-spacing:.12em;animation:fade .8s .4s both}
.splash p{color:var(--muted);text-align:center;font-size:14px;max-width:290px;animation:fade .8s .55s both}
.splash .stripe{position:absolute;bottom:0;left:0;right:0;height:8px;background:var(--red)}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:var(--cream);padding:13px 24px;border-radius:999px;font-weight:600;box-shadow:0 6px 18px rgba(123,30,46,.28);transition:transform .15s,background .15s;text-decoration:none;font-size:15px}
.btn:active{transform:scale(.97);background:var(--red-dark)}
.btn.ghost{background:var(--navy-soft);color:var(--red);box-shadow:none}
.btn.gold{background:var(--gold);color:#3A220C;box-shadow:0 6px 18px rgba(201,164,106,.35)}
.btn.small{padding:8px 14px;font-size:13px;box-shadow:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--red);font-weight:600;font-size:13px}
.del{color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer}
.remember{display:flex!important;flex-direction:row!important;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;color:var(--text);margin:2px 4px}
.remember input{width:18px;height:18px;accent-color:var(--red);flex:none}
.remember small{font-weight:400;color:var(--muted);font-size:12px}

.onboard{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px;animation:fade .5s both}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea,.input{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--text)}

/* Header */
header{background:var(--red);color:var(--cream);padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--gold)}
header .badge{width:40px;height:40px;border-radius:50%;background:#F6EAE3;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
header .badge img{width:52px;max-width:none}
header h2{font-family:"Libre Baskerville",serif;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;font-family:Inter;font-weight:400;font-size:12px;opacity:.8;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(246,234,223,.15);flex-shrink:0}
.icon-btn svg{width:20px;height:20px}
.me-btn{width:36px;height:36px;border-radius:50%;background:var(--cream);color:var(--red);font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0;position:relative}
.me-btn .crown{position:absolute;bottom:-4px;right:-6px;background:var(--gold);color:#3A220C;font-size:9px;border-radius:6px;padding:1px 4px;font-weight:700}

main{flex:1;overflow-y:auto;padding:16px 16px 96px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-title:first-child{margin-top:4px}
.section-title button{font-size:12px;color:var(--red);text-transform:none;letter-spacing:0;font-weight:600}

nav.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));flex-shrink:0}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:6px 0;border-radius:12px;position:relative}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.active{color:var(--red);font-weight:600}
nav.tabs .dot{position:absolute;top:2px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:var(--cream);font-size:10px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}

.card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:0 1px 3px rgba(90,18,32,.06);border:1px solid var(--line)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--cream);flex-shrink:0;font-size:15px}
.avatar.sm{width:36px;height:36px;font-size:12.5px}
.avatar.ch{border-radius:14px;font-size:20px}
.row .meta{flex:1;min-width:0}
.row .meta b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11px;color:var(--muted)}
.pill{background:var(--red);color:var(--cream);border-radius:999px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--navy-soft);color:var(--red);white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:#8A6326}
.tag.green{background:var(--green-soft);color:var(--green)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--red);border-color:var(--red);color:var(--cream)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.search input{border:none;outline:none;flex:1;background:none;font-size:16px;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.empty{text-align:center;color:var(--muted);padding:26px 20px;font-size:14px;line-height:1.5}
.note{background:var(--gold-soft);border:1px dashed var(--gold);color:#6B4A1A;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45;margin-bottom:12px}
.seg{display:flex;background:var(--navy-soft);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--red);box-shadow:0 1px 3px rgba(90,18,32,.1)}

/* Home */
.hello{margin:4px 2px 4px}
.hello h3{font-family:"Libre Baskerville",serif;color:var(--red);font-size:21px}
.hello p{color:var(--muted);font-size:13.5px;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;text-align:center;color:var(--red);position:relative}
.tile .ico{width:44px;height:44px;border-radius:14px;background:var(--navy-soft);display:grid;place-items:center;font-size:22px}
.tile.bde{background:var(--red);color:var(--cream);border-color:var(--red)}
.tile.bde .ico{background:rgba(246,234,223,.15)}
.tile .pill{position:absolute;top:8px;right:8px}

/* Reminders */
.reminder{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--gold)}
.count{min-width:54px;text-align:center;border-radius:12px;background:var(--red);color:var(--cream);padding:8px 4px}
.count b{display:block;font-family:"Libre Baskerville",serif;font-size:19px}
.count span{font-size:10px;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.reminder .txt{flex:1;font-size:14px;line-height:1.45;min-width:0}
.reminder .txt small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.bell{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--navy-soft);color:var(--muted);flex-shrink:0}
.bell.on{background:var(--gold);color:#3A220C}
.bell svg{width:19px;height:19px}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h3{font-family:"Libre Baskerville",serif;color:var(--red);font-size:17px;text-transform:capitalize}
.cal-head .icon-btn{background:var(--navy-soft);color:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding:4px 0}
.cal .day{aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13.5px;background:var(--card);border:1px solid var(--line)}
.cal .day.out{opacity:.35}
.cal .day.today{border:2px solid var(--gold);font-weight:700}
.cal .day.sel{background:var(--red);color:var(--cream);border-color:var(--red)}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:12px 2px 4px;font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}
.month-sep{font-family:"Libre Baskerville",serif;color:var(--red);font-size:15px;margin:18px 4px 8px;text-transform:capitalize}
.event{display:flex;gap:14px;text-align:left;width:100%}
.date{width:58px;flex-shrink:0;border-radius:14px;overflow:hidden;text-align:center;border:1.5px solid var(--red);align-self:flex-start;background:var(--card)}
.date .m{background:var(--red);color:var(--cream);font-size:11px;font-weight:700;text-transform:uppercase;padding:4px 0;letter-spacing:.06em}
.date .d{font-family:"Libre Baskerville",serif;font-size:20px;padding:5px 0;color:var(--red);white-space:nowrap}
.date .d.range{font-size:14px;padding:9px 0}
.event h3{font-size:15px;margin-bottom:4px}
.event .info{font-size:13px;color:var(--muted);line-height:1.5}

/* Billetterie */
.ticket{padding:0;overflow:hidden}
.ticket .top{padding:14px;display:flex;gap:14px}
.ticket .bottom{border-top:2px dashed var(--line);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg)}
.gauge{height:6px;background:var(--navy-soft);border-radius:3px;overflow:hidden;margin-top:8px}
.gauge i{display:block;height:100%;background:var(--red)}
.price{font-family:"Libre Baskerville",serif;color:var(--red);font-size:18px;white-space:nowrap}
.booked{display:inline-flex;align-items:center;gap:6px;color:var(--green);background:var(--green-soft);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}

/* Shop */
.product{padding:0;overflow:hidden}
.product .pic{height:230px;background:#F7EEE6;display:flex;align-items:center;justify-content:center;position:relative}
.product .pic img{max-height:100%;max-width:100%;object-fit:contain}
.product .pic .tag{position:absolute;top:12px;left:12px}
.product .body{padding:14px}
.product h3{font-family:"Libre Baskerville",serif;color:var(--red);font-size:17px}
.product p{font-size:13.5px;color:#5B4440;margin:6px 0 10px;line-height:1.45}
.sizes{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sizes span{border:1.5px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.thumbs{display:flex;gap:8px;position:absolute;bottom:10px;right:10px}
.thumbs button{width:44px;height:44px;border-radius:10px;overflow:hidden;border:2px solid var(--card);background:#F6EAE3}
.thumbs button.on{border-color:var(--red)}
.thumbs img{width:100%;height:100%;object-fit:cover}

/* Photos */
.album-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.album{border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-align:left}
.album .cover{aspect-ratio:4/3;background:#EADBCB center/cover}
.album div.cap{padding:9px 10px}
.album b{display:block;font-size:13.5px}
.album span{font-size:12px;color:var(--muted)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos button{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#EADBCB}
.photos img{width:100%;height:100%;object-fit:cover}
.lightbox{position:absolute;inset:0;z-index:65;background:rgba(30,8,12,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px;color:var(--cream)}
.lightbox img{max-width:100%;max-height:75%;border-radius:10px}

/* Drive */
.folder{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.folder .ico{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;font-size:21px;flex-shrink:0}
.file .ico{background:var(--navy-soft)}
.sub{font-size:12.5px;color:var(--muted)}

/* Polls */
.poll h3{font-size:15.5px;line-height:1.4;margin:8px 0 12px}
.opt{position:relative;display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;overflow:hidden;font-size:14px;background:var(--card)}
.opt .bar{position:absolute;inset:0 auto 0 0;background:var(--red-soft);z-index:0;transition:width .5s}
.opt span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px}
.opt.mine{border-color:var(--red);font-weight:600}
.opt:not([disabled]):active{transform:scale(.99)}

/* Q&A */
.q{display:flex;gap:12px}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:40px;border-radius:12px;padding:6px 0;background:var(--navy-soft);color:var(--red);font-weight:700;font-size:13px}
.vote.on{background:var(--red);color:var(--cream)}
.q .body{flex:1;font-size:14px;line-height:1.45;min-width:0}
.q .body small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.answer{margin-top:8px;background:var(--green-soft);color:#24502C;border-radius:10px;padding:8px 10px;font-size:13px}

/* Todo */
.todo{display:flex;gap:12px;align-items:flex-start}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--gold);flex-shrink:0;display:grid;place-items:center;color:var(--cream);font-size:14px;margin-top:1px}
.check.on{background:var(--green);border-color:var(--green)}
.todo .txt{flex:1;font-size:14px;line-height:1.4;min-width:0}
.todo .txt.done{text-decoration:line-through;color:var(--muted)}
.todo .txt small{display:block;color:var(--muted);font-size:12px;margin-top:3px;text-decoration:none}
.bde-banner{background:linear-gradient(135deg,var(--red),#5A1220);color:var(--cream);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:6px}
.bde-banner b{font-family:"Libre Baskerville",serif;font-size:16px;display:block}
.bde-banner span{font-size:12.5px;opacity:.85}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font-size:13px;font-weight:600;color:var(--red);display:flex;gap:8px;align-items:center}

/* Chat */
.chat{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.chat.open{transform:none}
.messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.daysep{align-self:center;font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 10px;border-radius:999px;margin:10px 0}
.msg{max-width:80%;padding:9px 12px;border-radius:16px;font-size:14.5px;line-height:1.4;background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px;word-wrap:break-word;animation:fade .25s both}
.msg .who{font-size:12px;font-weight:700;color:var(--red);margin-bottom:2px}
.msg time{display:block;font-size:10.5px;color:var(--muted);text-align:right;margin-top:3px}
.msg.me{align-self:flex-end;background:var(--red);color:var(--cream);border:none;border-bottom-left-radius:16px;border-bottom-right-radius:5px}
.msg.me time{color:rgba(246,234,223,.75)}
.msg time .del{margin-left:8px;font-size:11px;font-weight:600;color:inherit;opacity:.8;text-decoration:underline;padding:0}
.msg time .del:hover{opacity:1}
.composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.composer input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;outline:none;font-size:16px;background:var(--bg);min-width:0}
.send{width:44px;height:44px;border-radius:50%;background:var(--red);color:var(--cream);display:grid;place-items:center;flex-shrink:0}
.send svg{width:20px;height:20px}

/* Profile */
.profile-head{text-align:center;padding:10px 0 18px}
.profile-head .avatar{width:84px;height:84px;font-size:28px;margin:0 auto 12px;border:4px solid var(--card);box-shadow:0 4px 14px rgba(90,18,32,.2)}
.profile-head h3{font-family:"Libre Baskerville",serif;font-size:20px;color:var(--red)}
.profile-head p{color:var(--muted);font-size:14px;margin-top:4px}
.kv{font-size:14px;line-height:1.7}
.kv b{color:var(--muted);font-weight:500;font-size:12.5px;display:block;margin-top:8px;line-height:1.3}

/* Sheet / fab / toast */
.overlay{position:absolute;inset:0;background:rgba(40,10,16,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:90%;overflow-y:auto}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-family:"Libre Baskerville",serif;color:var(--red);margin-bottom:14px;font-size:18px}
.sheet form{display:flex;flex-direction:column;gap:12px}
.fab{position:absolute;right:18px;bottom:84px;height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--red);color:var(--cream);display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;box-shadow:0 8px 20px rgba(123,30,46,.4);z-index:10}
.fab svg{width:22px;height:22px}
.toast{position:absolute;left:50%;top:80px;transform:translate(-50%,-20px);background:var(--red);color:var(--cream);padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;z-index:80;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dlg{position:absolute;inset:0;z-index:90;background:rgba(40,10,16,.5);display:flex;align-items:center;justify-content:center;padding:24px}
.dlg[hidden]{display:none}
.dlg .box{background:var(--card);border-radius:18px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(40,10,16,.3)}
.dlg .box p{line-height:1.5;font-size:14.5px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* ---------- Ordinateur : affichage paysage ---------- */
@media (min-width:900px){
  body{background:#E9DCCD}
  .app{max-width:1280px;display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"head head" "nav main"}
  #header{grid-area:head;padding:14px 28px}
  main{grid-area:main;padding:28px 40px 48px}
  main>*{max-width:1080px}
  nav.tabs{grid-area:nav;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:18px 12px}
  nav.tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:12px 14px}
  nav.tabs button.active{background:var(--gold-soft)}
  nav.tabs .dot{position:static;margin-left:auto}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  main .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .fab{right:40px;bottom:32px}
  .chat{left:auto;width:min(560px,48%);box-shadow:-20px 0 50px rgba(40,10,16,.18)}
  .sheet{left:50%;right:auto;width:600px;max-width:92%;margin-left:-300px;bottom:24px;border-radius:22px;max-height:88vh}
  .toast{top:90px}
}

function ago(t){const d=Date.now()-t;if(d<60e3)return'à l\'instant';if(d<H)return Math.floor(d/60e3)+' min';if(d<D)return hm(t);if(d<2*D)return'hier';return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function ask(msg,ok='Confirmer'){return new Promise(res=>{const d=$('#dlg');
  d.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="acts"><button class="btn ghost small" data-r="0">Annuler</button><button class="btn small" data-r="1">${esc(ok)}</button></div></div>`;
  d.hidden=false;const done=v=>{d.hidden=true;d.innerHTML='';res(v);};
  d.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>done(b.dataset.r==='1'));d.querySelector('[data-r="1"]').focus();});}

  d.innerHTML=`<form class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p><input class="input" name="v" value="${esc(def)}" autocomplete="off"><div class="acts"><button type="button" class="btn ghost small" data-r="0">Annuler</button><button class="btn small">Valider</button></div></form>`;
  d.hidden=false;const f=d.querySelector('form'),done=v=>{d.hidden=true;d.innerHTML='';res(v);};

function bindReminders(){

/* ---------- Installation sur l'écran d'accueil ---------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(entered&&S.me)render();});
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
/* ---------- Notifications sur le téléphone (rappels du BDE, messages) ---------- */
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const onIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e));
const b64u=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0));};
const pushState=()=>!pushOK()?(onIOS()&&!isStandalone()?'install':'unsupported'):Notification.permission==='denied'?'denied':S.pushOn&&Notification.permission==='granted'?'on':'off';
async function enablePush(msgs){
  if(!pushOK()){toast(onIOS()&&!isStandalone()?"Sur iPhone, installez d'abord l'app sur l'écran d'accueil, puis ouvrez-la depuis l'icône MDAFC":"Les notifications ne sont pas disponibles sur ce navigateur");return false;}
  let perm=Notification.permission;
  try{if(perm==='default')perm=await Notification.requestPermission();}catch(e){}
  if(perm!=='granted'){toast(perm==='denied'?'Notifications bloquées : autorisez-les pour MDAFC dans les réglages du téléphone':'Notifications non activées');render();return false;}
  try{
    const key=await Backend.pushKey();if(!key)throw new Error('service pas encore prêt, réessayez plus tard');
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    const j=sub.toJSON();await Backend.savePush(j.endpoint,j.keys.p256dh,j.keys.auth,msgs!==false);
    S.pushOn=true;S.pushMsgs=msgs!==false;localSave();render();toast('Notifications activées 🔔');return true;
  }catch(e){toast('Activation impossible : '+(e.message||e));return false;}
}
async function disablePush(){
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){await Backend.removePush(sub.endpoint).catch(()=>{});await sub.unsubscribe();}}catch(e){}
  S.pushOn=false;localSave();render();toast('Notifications désactivées');
}
// Au démarrage (et après une connexion BDE) : rattache l'abonnement au bon compte
async function refreshPush(){
  if(!S.pushOn||!pushOK()||Notification.permission!=='granted'||Backend.mode==='local')return;
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(!sub){S.pushOn=false;localSave();return;}
    const j=sub.toJSON();await Backend.savePush(j.endpoint,j.keys.p256dh,j.keys.auth,S.pushMsgs!==false);}catch(e){console.warn(e);}
}
// Une fois par appareil, à l'ouverture : propose d'activer les notifications (élèves déjà inscrits compris)
async function askPushOnce(){
  if(Backend.mode==='local'||Backend.status!=='online'||pushState()!=='off')return;
  let asked=false;try{asked=localStorage.getItem('mdafc-push-asked')==='1';}catch(e){}
  if(asked)return;

  let key=null;try{key=await Backend.pushKey();}catch(e){}

  openSheet(`<div style="text-align:center;font-size:44px;line-height:1;margin:6px 0 8px">🔔</div>

    <p class="sub" style="text-align:center;line-height:1.5;margin:6px 0 16px">Soyez prévenu(e) des rappels de paiement du BDE et des nouveaux messages, même quand l'application est fermée.</p>

    <button class="btn ghost block small" id="pushLater" style="margin-top:8px">Plus tard</button>
    <p class="sub" style="text-align:center;font-size:12px;margin-top:10px">Vous pourrez les activer ou les couper à tout moment dans Mon profil.</p>`);
  // le clic déclenche directement la demande d'autorisation (obligatoire sur iPhone)

  $('#pushLater').onclick=closeSheet;

function dateBox(e){
  if(e.end&&e.end!==e.date){const a=dt(e.date),b=dt(e.end);
    return `<div class="date"><div class="m">${mon(e.date)}${a.getMonth()!==b.getMonth()?'–'+mon(e.end):''}</div><div class="d range">${a.getDate()}–${b.getDate()}</div></div>`;}
  return `<div class="date"><div class="m">${mon(e.date)}</div><div class="d">${dt(e.date).getDate()}</div></div>`;
}
function whenText(e){
  if(e.end&&e.end!==e.date)return `Du ${fmtDate(e.date,{day:'numeric',month:'long'})} au ${fmtDate(e.end,{day:'numeric',month:'long'})}`;
  return fmtDate(e.date,{weekday:'long'})+(e.time?' · '+e.time.replace(':','h'):'');
}
function eventRow(e){
  const c=CATS[e.cat]||CATS.bde;
  return `<button class="card event" data-ev="${e.id}">${dateBox(e)}
    <div style="flex:1;min-width:0"><h3>${esc(e.title)}</h3><div class="info">${whenText(e)} · ${esc(e.place)}</div>
    <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="tag" style="background:${c.color}22;color:${c.color}">${c.label}</span>${e.promos.length<3?`<span class="tag gold">${esc(e.promos.join(' · '))}</span>`:''}${e.booking?'<span class="tag green">🎟️ Réservation</span>':''}${e.board?'<span class="tag">🙋 Questions</span>':''}</div></div></button>`;
}

function vAgenda(){
  const mode=ui.mode||'mois', now=new Date();

  const sel=ui.sel||todayStr();
  const evs=S.events.filter(forMe);

  let html=`<div class="section-title">Rappels ${isBDE()?'<button id="addRem">+ Nouveau rappel</button>':''}</div>
    <div class="list">${S.reminders.filter(r=>daysLeft(r.deadline)>=0).sort((a,b)=>a.deadline.localeCompare(b.deadline)).map(reminderCard).join('')||'<div class="empty">Aucun rappel.</div>'}</div>

  if(mode==='mois'){
    const y=cur.getFullYear(),m=cur.getMonth(),first=(new Date(y,m,1).getDay()+6)%7;
    const nDays=new Date(y,m+1,0).getDate(),cellsN=Math.ceil((first+nDays)/7)*7;
    let cells='';
    for(let i=0;i<cellsN;i++){const d=new Date(y,m,1-first+i),s=ymd(d),de=onDay(s);
      cells+=`<button class="day ${d.getMonth()!==m?'out':''} ${s===todayStr()?'today':''} ${s===sel?'sel':''}" data-day="${s}">${d.getDate()}<span class="dots">${de.slice(0,3).map(e=>`<i style="background:${s===sel?'#F6EADF':(CATS[e.cat]||CATS.bde).color}"></i>`).join('')}</span></button>`;}
    html+=`<div class="card"><div class="cal-head"><button class="icon-btn" id="prev" aria-label="Mois précédent">${I.back}</button><h3>${cur.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h3><button class="icon-btn" id="nextm" aria-label="Mois suivant">${I.next}</button></div>
      <div class="cal">${['L','M','M','J','V','S','D'].map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>
      <div class="legend">${Object.values(CATS).map(c=>`<span><i style="background:${c.color}"></i>${c.label}</span>`).join('')}</div></div>

  } else {
    const up=evs.filter(e=>evEnd(e)>=todayStr()).sort((a,b)=>a.date.localeCompare(b.date));
    let lastM='';
    html+=up.map(e=>{const mo=dt(e.date).toLocaleDateString('fr-FR',{month:'long',year:'numeric'});const sep=mo!==lastM?`<div class="month-sep">${mo}</div>`:'';lastM=mo;return sep+`<div style="margin-bottom:10px">${eventRow(e)}</div>`;}).join('')||'<div class="empty">Aucun événement à venir.</div>';
  }
  $('#main').innerHTML=html;
  bindReminders(); bindEventRows();
  $$('[data-mode]').forEach(b=>b.onclick=()=>{ui.mode=b.dataset.mode;render();});

function downloadICS(e){
  const d=e.date.replace(/-/g,''),stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  let start,end;
  if(e.time&&!e.end){start='DTSTART:'+d+'T'+e.time.replace(':','')+'00';end='';}
  else{const n=new Date(dt(evEnd(e)).getTime()+D);start='DTSTART;VALUE=DATE:'+d;end='DTEND;VALUE=DATE:'+ymd(n).replace(/-/g,'');}
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MDAFC//FR','BEGIN:VEVENT','UID:'+e.id+'@mdafc','DTSTAMP:'+stamp,start,end,'SUMMARY:'+e.title,'LOCATION:'+e.place,'DESCRIPTION:'+(e.desc||''),'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download=e.title.replace(/[^\wÀ-ÿ -]/g,'')+'.ics';a.click();
}

function pickPhotos(a){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=true;
  inp.onchange=async()=>{const n=inp.files.length;for(const file of inp.files)a.photos.push({src:await storeImage(file,1200)});if(save()){render();toast(n+' photo(s) ajoutée(s)');}else a.photos.splice(-n);};

// Photos : redimensionnées puis envoyées dans le stockage partagé (ou gardées sur l'appareil en mode démo)
async function storeImage(file,max){const d=await toDataURL(file,max);if(Backend.mode==='local')return d;toast('Envoi de la photo…');const blob=await (await fetch(d)).blob();return await Backend.upload(blob,'jpg');}
function toDataURL(file,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82));};img.src=r.result;};r.readAsDataURL(file);});}

const S2_SINCE=Date.parse('2026-11-19T00:00:00');
function fileSem(f){
  if(f.sem)return f.sem;
  const has=sm=>(S.subjects[f.promo]?.[sm]||[]).some(x=>x.n===f.subject),a=has('S1'),b=has('S2');
  return a&&!b?'S1':b&&!a?'S2':(f.t||0)>=S2_SINCE?'S2':'S1';
}
function fileRow(f){
  return `<button class="card folder file" data-file="${f.id}"><span class="ico">${f.url&&!f.data?'🔗':'📄'}</span><div style="flex:1;min-width:0"><b style="font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.title)}</b>

}
function bindFiles(){
  $$('[data-file]').forEach(b=>b.onclick=ev=>{const d=ev.target.closest('[data-delfile]');const f=S.files.find(x=>x.id===b.dataset.file);if(!f)return;
    if(ev.target.closest('[data-movefile]')){ev.stopPropagation();f.sem=fileSem(f)==='S1'?'S2':'S1';save();render();toast('Document déplacé en '+f.sem);return;}
    if(d){ev.stopPropagation();(async()=>{if(!await ask('Supprimer le document « '+f.title+' » ?','Supprimer'))return;S.files=S.files.filter(x=>x.id!==f.id);save();render();toast('Document supprimé');})();return;}
    openFile(f);});
}
function openFile(f){
  if(f.data){const a=document.createElement('a');a.href=f.data;a.download=f.fname||f.title;a.click();return;}
  if(f.url)window.open(f.url,'_blank','noopener');
}
function uploadFile(promo,subject,kind,sem){sem=sem||S.semester;

    <label class="field" id="upTitle">Titre<input name="title" placeholder="Ex. Examen janvier 2025 + corrigé"><small class="sub" id="upHint" hidden>Plusieurs fichiers : chacun garde son nom de fichier comme titre.</small></label>
    <label class="field">Année universitaire<input name="year" required value="2025-2026"></label>
    <label class="field">…ou lien (Google Drive, OneDrive…)<input type="url" name="url" placeholder="https://drive.google.com/…"></label>
    <button class="btn block">Partager avec les promos</button></form>`);
  $('#upFiles').onchange=e=>{const n=e.target.files.length;$('#upHint').hidden=n<2;$('#upTitle input').placeholder=n>1?'Facultatif : préfixe commun (ex. Examens 2025)':'Ex. Examen janvier 2025 + corrigé';};
  $('#f').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.target);const files=fd.getAll('file').filter(f=>f&&f.size),url=fd.get('url').trim(),title=fd.get('title').trim();
    if(!files.length&&!url){toast('Ajoutez un fichier ou un lien');return;}
    if(files.length<2&&!title){toast('Donnez un titre au document');return;}
    const lim=Backend.mode==='local'?1.5e6:25e6,big=files.filter(f=>f.size>lim);
    if(big.length){toast((big.length>1?big.length+' fichiers dépassent':'« '+big[0].name+' » dépasse')+' la limite de '+(lim/1e6)+' Mo. Utilisez plutôt un lien.');return;}
    const btn=ev.target.querySelector('.btn');btn.disabled=true;
    const base={promo,sem,subject,kind:fd.get('kind'),year:fd.get('year').trim(),author:myId()},added=[];
    const name=f=>f.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim();
    try{
      for(const [i,file] of files.entries()){
        btn.textContent='Envoi '+(i+1)+' / '+files.length+'…';
        let data='',link='';
        if(Backend.mode!=='local')link=await Backend.upload(file,(file.name.split('.').pop()||'bin').toLowerCase());
        else data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file);});
        added.push({...base,id:uid('f'),title:files.length>1?(title?title+' – ':'')+name(file):title,fname:file.name,url:link,data,t:Date.now()+i});}
      if(url)added.push({...base,id:uid('f'),title:title||url,fname:'',url,data:'',t:Date.now()+files.length});
    }catch(err){toast('Échec de l\'envoi'+(added.length?' après '+added.length+' fichier(s)':'')+' : '+(err.message||err));}
    if(!added.length){btn.disabled=false;btn.textContent='Partager avec les promos';return;}
    S.files.push(...added);
    if(save()){closeSheet();ui.kind=fd.get('kind');render();toast(added.length>1?added.length+' documents partagés':'Document partagé');}else S.files.splice(-added.length);};
}

function pollCard(p){
  const me=myId(),total=p.options.reduce((a,o)=>a+o.votes.length,0),voted=p.options.some(o=>o.votes.includes(me)),show=voted||p.closed;
  return `<div class="card poll"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="tag ${p.closed?'':'green'}">${p.closed?'Terminé':'En cours'}</span><span class="sub">par ${esc(person(p.author).name)}</span></div>
    <h3>${esc(p.question)}</h3>
    ${p.options.map((o,i)=>{const pct=total?Math.round(o.votes.length/total*100):0;const mine=o.votes.includes(me);
      return `<button class="opt ${mine?'mine':''}" data-vote="${p.id}|${i}" ${p.closed?'disabled':''}>${show?`<i class="bar" style="width:${pct}%"></i>`:''}<span><span>${mine?'✓ ':''}${esc(o.text)}</span>${show?`<b>${pct} %</b>`:''}</span></button>`;}).join('')}
    <div class="sub" style="display:flex;justify-content:space-between;margin-top:4px"><span>${total} vote${total>1?'s':''}${voted&&!p.closed?' · touchez une autre réponse pour changer':''}</span>
    ${isBDE()?`<span><button class="del" data-who="${p.id}">répondants</button> · <button class="del" data-close="${p.id}">${p.closed?'rouvrir':'clôturer'}</button> · <button class="del" data-delpoll="${p.id}">supprimer</button></span>`:''}</div></div>`;
}

  $$('[data-vote]').forEach(b=>b.onclick=()=>{const[id,i]=b.dataset.vote.split('|');const p=S.polls.find(x=>x.id===id),me=myId();
    p.options.forEach(o=>o.votes=o.votes.filter(v=>v!==me));p.options[+i].votes.push(me);save();render();});

function editPair(parrain){

  openSheet(`<h3>Binôme de parrainage</h3><form id="f">

let current=null;
function openChat(id){
  current=chanById(id);if(!current)return;
  $('#chatHeader').innerHTML=`<button class="icon-btn" id="back" aria-label="Retour">${I.back}</button>
    <div class="badge" style="background:${current.color};font-size:20px">${current.emoji}</div>

  // Flèche retour : réagit dès le toucher (sur iPhone, le premier toucher servait seulement à fermer le clavier)
  const bk=$('#back');let done=false;
  const leave=e=>{e.preventDefault();if(done)return;done=true;if(history.state?.chat)history.back();else closeChat();};
  bk.addEventListener('pointerdown',leave);bk.addEventListener('click',leave);
  drawMessages();$('#chat').classList.add('open');S.read[id]=Date.now();save();
  // geste « retour » du téléphone (balayage, bouton Android) : ferme la conversation au lieu de quitter l'app
  if(!history.state?.chat)history.pushState({chat:1},'');
  // pas de clavier qui s'ouvre tout seul sur téléphone : il masquait la flèche retour
  if(!matchMedia('(pointer:coarse)').matches)setTimeout(()=>$('#msgInput').focus({preventScroll:true}),320);
}
function closeChat(){
  $('#msgInput').blur();$('#chat').classList.remove('open');current=null;

let ANC=null,ancLoading=false;
const normName=n=>String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]+/g,' ').trim();
// Nom qui désigne un membre du BDE : nom complet, ou prénom seul quand un seul membre le porte
const BDE_KEYS=(()=>{const full=new Map(),first=new Map();
  BDE_MEMBERS.forEach(m=>{full.set(normName(m.name),m);const f=normName(m.name.split(' ')[0]);first.set(f,first.has(f)?null:m);});
  first.forEach((m,k)=>{if(m&&!full.has(k))full.set(k,m);});return full;})();
const bdeByName=n=>BDE_KEYS.get(normName(n))||null;
// Profils sans doublons : un même nom n'apparaît qu'une fois (le plus récent), et les membres du BDE restent dans leur propre liste
function uniqueProfiles(){
  const best=new Map();
  for(const [id,p] of Object.entries(S.profiles||{})){const k=normName(p.name);if(!k||bdeByName(p.name))continue;
    const cur=best.get(k);if(!cur||(p.at||0)>(cur.at||0))best.set(k,{...p,id});}
  return [...best.values()];
}

/* ---------- Espace BDE : codes d'accès et inscrits ---------- */
async function drawCodes(){
  const box=$('#codesCard');if(!box)return;
  try{
    const [codes,studs]=await Promise.all([Backend.getCodes(),Backend.listStudents()]);
    if(!$('#codesCard'))return;
    // Une inscription = un appareil. On regroupe par personne (même nom), on met à part les membres du BDE
    // et les anciens appareils dont le profil a disparu (souvent l'appareil d'un membre avant sa connexion BDE).
    const groups=new Map(),orphans=[],bdeRows=new Map();
    for(const x of studs){const pr=S.profiles[x.id];
      if(!pr){orphans.push(x);continue;}
      const k=normName(pr.name),bm=bdeByName(pr.name);
      if(bm){bdeRows.set(bm.name,(bdeRows.get(bm.name)||[]).concat(x));continue;}
      const g=groups.get(k)||{name:pr.name,rows:[]};g.rows.push(x);groups.set(k,g);}
    const people=[...groups.values()].map(g=>({...g,promo:g.rows.slice().sort((a,b)=>b.joined_at.localeCompare(a.joined_at))[0].promo,
      first:g.rows.map(r=>r.joined_at).sort()[0],ids:g.rows.map(r=>r.id)})).sort((a,b)=>a.promo.localeCompare(b.promo)||a.name.localeCompare(b.name,'fr'));
    const n=p=>people.filter(x=>x.promo===p).length;
    box.innerHTML=`<p class="sub" style="line-height:1.5;margin-bottom:10px">Chaque étudiant entre une fois avec le code de sa promo. Changez un code s'il a circulé hors du Magistère : les inscrits gardent leur accès.</p>
      ${codes.map(c=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line);gap:6px"><div class="meta"><b>${esc(c.promo)}</b><span style="font-family:ui-monospace,monospace;letter-spacing:.05em;font-weight:700;color:var(--text)">${esc(c.code)}</span><span>${n(c.promo)} étudiant${n(c.promo)>1?'s':''}</span></div>
        <button class="btn ghost small" data-copy="${esc(c.code)}">Copier</button><button class="btn ghost small" data-code="${esc(c.promo)}">Changer</button></div>`).join('')}
      <button class="btn ghost block small" id="studList" style="margin-top:10px">Voir les inscrits (${people.length})</button>`;
    $$('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy).then(()=>toast('Code copié'),()=>toast(b.dataset.copy));});
    $$('[data-code]').forEach(b=>b.onclick=async()=>{const p=b.dataset.code;
      const sug=p.replace(' ','').toUpperCase()+'-'+Array.from(crypto.getRandomValues(new Uint8Array(5)),x=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[x%31]).join('');
      const c=await askText('Nouveau code pour '+p+' (6 caractères minimum) :',sug);if(!c)return;
      try{await Backend.setCode(p,c);toast('Code '+p+' modifié');drawCodes();}catch(e){toast(e.message);}});
    const removeAll=async ids=>{for(const id of ids)await Backend.removeStudent(id);};
    $('#studList').onclick=()=>{
      const dev=k=>k>1?` · ${k} appareils`:'';
      openSheet(`<h3>Étudiants inscrits (${people.length})</h3><p class="sub" style="margin-bottom:10px">Une même personne entrée depuis plusieurs appareils (Safari, icône de l'écran d'accueil, ordinateur) n'apparaît qu'une fois. Retirer lui coupe l'accès sur tous ses appareils : pensez ensuite à changer le code de sa promo.</p>
        <div class="list">${people.map((x,i)=>`<div class="card row"><div class="meta"><b>${esc(x.name)}</b><span>${esc(x.promo)} · depuis le ${new Date(x.first).toLocaleDateString('fr-FR')}${dev(x.ids.length)}</span></div><button class="btn ghost small" data-mv="${i}">Promo</button><button class="btn ghost small" data-kick="${i}">Retirer</button></div>`).join('')||'<div class="empty">Aucun étudiant inscrit pour le moment.</div>'}</div>
        ${bdeRows.size?`<div class="section-title">Anciens appareils des membres du BDE</div><div class="card row"><div class="meta"><b>${[...bdeRows.keys()].map(esc).join(', ')}</b><span>Entrés avec un code de promo avant leur connexion BDE. Ce ne sont pas des étudiants : vous pouvez nettoyer, leur compte BDE n'est pas touché.</span></div><button class="btn ghost small" id="cleanBde">Nettoyer</button></div>`:''}
        ${orphans.length?`<div class="section-title">Anciens appareils sans profil</div><div class="card row"><div class="meta"><b>${orphans.length} ancienne${orphans.length>1?'s':''} session${orphans.length>1?'s':''}</b><span>Appareils dont le profil a été remplacé (par exemple avant une connexion BDE)</span></div><button class="btn ghost small" id="cleanOrph">Nettoyer</button></div>`:''}`);
      $$('[data-mv]').forEach(b=>b.onclick=async()=>{const x=people[+b.dataset.mv];const p=await choose('Nouvelle promo pour '+x.name+' :',PROMOS);if(!p)return;
        try{for(const id of x.ids)await Backend.setStudentPromo(id,p);toast(x.name+' est maintenant en '+p);closeSheet();drawCodes();}catch(e){toast('Échec : '+(e.message||e));}});
      $$('[data-kick]').forEach(b=>b.onclick=async()=>{const x=people[+b.dataset.kick];if(!await ask('Retirer '+x.name+" de l'application"+(x.ids.length>1?' (sur ses '+x.ids.length+' appareils)':'')+' ?','Retirer'))return;
        try{await removeAll(x.ids);toast('Accès retiré');closeSheet();drawCodes();}catch(e){toast('Échec : '+(e.message||e));}});
      if($('#cleanBde'))$('#cleanBde').onclick=async()=>{const ids=[...bdeRows.values()].flat().map(r=>r.id);
        if(!await ask('Retirer ces '+ids.length+' anciens appareils ? Les comptes BDE restent actifs.','Nettoyer'))return;
        try{await removeAll(ids);toast('Anciens appareils retirés');closeSheet();drawCodes();}catch(e){toast('Échec : '+(e.message||e));}};
      if($('#cleanOrph'))$('#cleanOrph').onclick=async()=>{if(!await ask('Supprimer ces '+orphans.length+' anciennes sessions sans profil ?','Nettoyer'))return;
        try{await removeAll(orphans.map(o=>o.id));toast('Sessions nettoyées');closeSheet();drawCodes();}catch(e){toast('Échec : '+(e.message||e));}};
    };
  }catch(e){box.innerHTML=`<p class="sub">Codes indisponibles : ${esc(e.message||String(e))}</p>`;}
}

/* ================= Profil + connexion BDE ================= */
function vProfil(){
  const me=S.me,m=bdeMember(me.bde);
  $('#main').innerHTML=`<div class="profile-head">${avatar(me)}<h3>${esc(me.name)}</h3><p>${esc(me.promo)}${m?' · '+esc(m.role)+' du BDE':''}</p></div>
   <form class="card" id="pf" style="display:flex;flex-direction:column;gap:12px">
     <label class="field">Prénom et nom<input name="name" value="${esc(me.name)}" required></label>
     ${Backend.mode==='local'?`<label class="field">Promotion<select name="promo">${PROMOS.map(p=>`<option ${p===me.promo?'selected':''}>${p}</option>`).join('')}</select></label>`
       :`<div class="field">Promotion<div style="display:flex;gap:8px;align-items:center"><div class="input" style="flex:1">${esc(me.promo)}</div><button type="button" class="btn ghost small" id="chgPromo">Changer</button></div></div>`}
     <label class="field">Centres d'intérêt<input name="interests" value="${esc(me.interests||'')}" placeholder="Ex. Fiscalité, M&amp;A"></label>
     <button class="btn block">Enregistrer</button></form>
   <div class="section-title">Connexion BDE</div>
   <div class="card">${m
     ?`<p style="font-size:14px;line-height:1.5">✅ Connecté(e) en tant que <b>${esc(m.name)}</b> (${esc(m.role)}).</p>
       <div style="display:flex;gap:8px;margin-top:10px"><button class="btn small" style="flex:1" data-go="bde">Ouvrir l'Espace BDE</button><button class="btn ghost small" id="bdeOff">Se déconnecter</button></div>`
     :Backend.mode!=='local'?`<p style="font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:10px">Réservé aux 7 membres du bureau, avec l'e-mail enregistré par le BDE et votre mot de passe personnel.</p>
       <form id="bdeF" style="display:flex;flex-direction:column;gap:8px">
         <input class="input" type="email" name="email" required placeholder="Votre e-mail" autocomplete="username">
         <input class="input" type="password" name="pw" required minlength="8" placeholder="Mot de passe (8 caractères min.)" autocomplete="current-password">
         <input class="input" type="password" name="pw2" minlength="8" placeholder="Retapez le mot de passe" autocomplete="new-password" hidden>
         <button class="btn small" id="bdeGo">Se connecter</button>
         <button type="button" class="btn ghost small" id="bdeMode">Première connexion : créer mon mot de passe</button></form>`
     :`<p style="font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:10px">Réservé aux 7 membres du bureau : choisissez votre nom et entrez le mot de passe BDE.</p>
       <form id="bdeF" style="display:flex;flex-direction:column;gap:8px">
         <select class="input" name="who" required><option value="">Je suis…</option>${BDE_MEMBERS.map(x=>`<option value="${x.id}">${esc(x.name)} – ${esc(x.role)}</option>`).join('')}</select>
         <div style="display:flex;gap:8px"><input class="input" type="password" name="pw" required placeholder="Mot de passe BDE" autocomplete="current-password" style="flex:1;min-width:0"><button class="btn small">Connexion</button></div></form>`}</div>
   <div class="section-title">Notifications</div>
   <div class="card" style="font-size:13.5px;line-height:1.5;color:var(--muted)">${(()=>{const st=pushState();
     if(st==='on')return `<b style="color:var(--text)">✅ Notifications activées sur cet appareil</b><br>Vous êtes prévenu(e) des rappels du BDE${S.pushMsgs!==false?' et des nouveaux messages':''}.
       <label style="display:flex;gap:8px;align-items:center;margin:10px 0;color:var(--text)"><input type="checkbox" id="pushMsgs" ${S.pushMsgs!==false?'checked':''} style="width:18px;height:18px;accent-color:var(--red)"> Aussi les messages (chats de ma promo, Général, messages privés)</label>
       <button class="btn ghost small" id="pushStop">Désactiver</button>`;
     if(st==='install')return "Sur iPhone, installez d'abord l'app sur l'écran d'accueil (Safari → Partager → « Sur l'écran d'accueil »), ouvrez-la depuis l'icône, puis revenez ici.";
     if(st==='denied')return 'Notifications bloquées sur cet appareil : autorisez-les pour MDAFC dans les réglages du téléphone, puis revenez ici.';
     if(st==='unsupported')return 'Ce navigateur ne permet pas les notifications.';
     return `Recevez les rappels de paiement du BDE et les nouveaux messages, même quand l'app est fermée.<button class="btn block small" id="pushStart" style="margin-top:10px">🔔 Activer les notifications</button>`;})()}
     <br><span style="font-size:12.5px">La cloche 🔔 d'un rappel ajoute aussi une alerte à J-7, J-3, J-1 et le jour J.</span></div>
   <button class="btn ghost block" id="reset" style="margin-top:18px">Réinitialiser la démo</button>`;
  if($('#pushStart'))$('#pushStart').onclick=()=>enablePush(true);
  if($('#pushStop'))$('#pushStop').onclick=disablePush;
  if($('#pushMsgs'))$('#pushMsgs').onchange=e=>enablePush(e.target.checked);
  bindGo();
  $('#pf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(me,{name:f.get('name').trim(),promo:f.get('promo')||me.promo,interests:f.get('interests').trim()});save();Backend.saveProfile(me);render();toast('Profil mis à jour');};
  if($('#bdeMode'))$('#bdeMode').onclick=()=>{const F=$('#bdeF'),c=F.dataset.mode!=='create';F.dataset.mode=c?'create':'login';
    F.pw2.hidden=!c;F.pw2.required=c;F.pw.autocomplete=c?'new-password':'current-password';
    $('#bdeGo').textContent=c?'Créer mon compte BDE':'Se connecter';
    $('#bdeMode').textContent=c?"J'ai déjà un compte : me connecter":'Première connexion : créer mon mot de passe';
    if(c)F.pw2.focus();};
  if($('#bdeF')&&Backend.mode!=='local')$('#bdeF').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    const create=e.target.dataset.mode==='create',pw=f.get('pw');
    if(create&&f.get('pw2')!==pw){toast('Les deux mots de passe ne correspondent pas');return;}
    const btns=[...e.target.querySelectorAll('button')];btns.forEach(b=>b.disabled=true);
    try{await Backend.flush();const mem=await Backend.loginBDE(f.get('email'),pw,create);
      S.uid=Backend.uid;me.id=S.uid;me.bde=mem;me.name=bdeMember(mem).name;localSave();Backend.saveProfile(me);
      toast((create?'Compte créé. ':'')+'Bienvenue dans l\'Espace BDE, '+me.name.split(' ')[0]+' !');go('bde');}
    catch(err){btns.forEach(b=>b.disabled=false);toast(err.message);}};
  else if($('#bdeF'))$('#bdeF').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    if(await sha256(f.get('pw'))!==S.bdeHash){toast('Mot de passe incorrect');return;}
    const mem=bdeMember(f.get('who'));me.bde=mem.id;me.name=mem.name;save();toast('Bienvenue dans l\'Espace BDE, '+mem.name.split(' ')[0]+' !');go('bde');};
  if($('#bdeOff'))$('#bdeOff').onclick=async()=>{
    if(Backend.mode!=='local'){await Backend.flush();S.uid=await Backend.logoutBDE();me.id=S.uid;me.bde=null;localSave();location.reload();return;}
    me.bde=null;save();render();toast('Déconnecté(e) du BDE');};
  if($('#chgPromo'))$('#chgPromo').onclick=async()=>{
    const c=await askText('Entrez le code de votre promo (le BDE vous le donne). Exemple : MAG3-XXXXX');if(!c)return;
    try{const promo=await Backend.joinPromo(c);me.promo=promo;save();Backend.saveProfile(me);render();toast('Vous êtes maintenant en '+promo);}catch(e){toast(e.message);}};
  $('#reset').hidden=Backend.mode==='supabase';
  $('#reset').onclick=async()=>{if(await ask('Effacer vos données de démonstration ?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload();}};
}

/* ================= Feuille modale ================= */
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('show');$('#overlay').classList.add('show');$('#sheet').scrollTop=0;}
function closeSheet(){$('#sheet').classList.remove('show');$('#overlay').classList.remove('show');flushRender();}
$('#overlay').onclick=closeSheet;

/* ================= Mises à jour en direct ================= */
let renderPending=false;
function liveRender(){
  localSave();
  if(!entered||!S.me)return;
  if(current){current=chanById(current.id);if(current){drawMessages();S.read[current.id]=Date.now();}}
  const a=document.activeElement;
  if($('#sheet').classList.contains('show')||!$('#lightbox').hidden||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){renderPending=true;return;}
  const st=$('#main').scrollTop;render();$('#main').scrollTop=st;
}
function flushRender(){if(renderPending){renderPending=false;setTimeout(liveRender,50);}}
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&!$('#sheet').classList.contains('show'))flushRender();},150));

/* ================= Démarrage ================= */
if(window.MDAFC_CONFIG&&String(MDAFC_CONFIG.url).startsWith('mock')){const b=document.createElement('div');b.textContent='VERSION DE TEST – rien n\'est enregistré dans la vraie application (codes : MAG1-TEST, MAG2-TEST, MAG3-TEST)';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:999;background:#E8A317;color:#2E1418;font:600 12px Inter,sans-serif;text-align:center;padding:5px 8px';document.body.appendChild(b);}
(async()=>{
  try{
    const r=await Backend.init(S,SEED,{onChange:liveRender,onError:e=>{console.warn(e);toast('Action non enregistrée : '+(e.message||e));}});
    if(Backend.mode!=='local'){
      S.uid=r.uid;
      if(S.me&&r.joined){S.me.id=S.uid;S.me.bde=r.member;if(r.member)S.me.name=bdeMember(r.member).name;Backend.saveProfile(S.me);}
      localSave();
      if(r.bdeRefused)setTimeout(()=>toast('Cette adresse n\'est pas enregistrée comme membre du BDE'),1200);
      else if(r.member)setTimeout(()=>toast('Connecté(e) au BDE : '+bdeMember(r.member).name),1200);
      if(r.joined)refreshPush();
    }
  }catch(e){console.warn(e);toast('Hors ligne : affichage des dernières données enregistrées');}
  splash();
})();
</script>
<script>
// Pas de zoom (pincement ou double-tap), sur toutes les pages
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
(()=>{let last=0;document.addEventListener('touchend',e=>{const now=Date.now();
  if(now-last<350&&!e.target.closest('input,textarea,select,[contenteditable]')){e.preventDefault();e.target.closest('button,a,label,[data-ev],[data-day]')?.click();}
  last=now;},{passive:false});})();
</script>
